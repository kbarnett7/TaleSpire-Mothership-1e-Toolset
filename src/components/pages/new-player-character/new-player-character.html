<error-panel></error-panel>

<form id="newPlayerCharacterForm" class="mb-18" onsubmit="this.handleFormSubmit(event)">
    <div id="stepDiv" class="mt-2 mb-2 p-2 rounded-xl bg-gray-200"></div>

    <div class="flex justify-center-safe">
        <button
            id="previousButton"
            type="submit"
            class="text-black bg-white hover:bg-gray-100 active:bg-gray-300 border-3 border-black font-bold min-w-32 px-4 py-1 my-2 mr-2 rounded-full transition duration-150 ease-in-out cursor-pointer uppercase"
        >
            PREVIOUS
        </button>
        <button
            id="nextButton"
            type="submit"
            class="text-white bg-black hover:bg-gray-900 active:bg-gray-700 font-bold min-w-32 px-4 py-1 my-2 rounded-full transition duration-150 ease-in-out cursor-pointer uppercase"
        >
            NEXT
        </button>
    </div>
</form>
