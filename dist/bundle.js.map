export default "<div id=\"customSelectContainer\" class=\"block relative h-full\">\r\n    <div\r\n        id=\"customSelectButton\"\r\n        class=\"flex justify-between items-center w-full h-full bg-white text-base text-black border-3 border-black px-2 py-1 hover:bg-gray-200 transition duration-150 ease-in-out focus:outline-0 cursor-pointer\"\r\n        onclick=\"this.handleCustomSelectButtonClicked(event)\"\r\n    >\r\n        <span id=\"selectedOption\" class=\"overflow-hidden whitespace-nowrap\">Select option...</span>\r\n        <span class=\"text-black\">\r\n            <svg\r\n                xmlns=\"http://www.w3.org/2000/svg\"\r\n                height=\"24px\"\r\n                viewBox=\"0 -960 960 960\"\r\n                width=\"24px\"\r\n                fill=\"currentColor\"\r\n                class=\"inline\"\r\n            >\r\n                <path d=\"M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z\" />\r\n            </svg>\r\n        </span>\r\n        <input type=\"hidden\" name=\"inputSelectedOption\" id=\"inputSelectedOption\" value=\"\" />\r\n    </div>\r\n\r\n    <div\r\n        id=\"customSelectMenu\"\r\n        class=\"absolute z-50 w-full overflow-auto bg-white text-base text-black px-1 py-1 border-x-3 border-b-3 border-t-1 border-black opacity-20 scale-0\"\r\n    ></div>\r\n</div>\r\n";
